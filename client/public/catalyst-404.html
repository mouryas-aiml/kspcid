<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>KSPCID — opening route</title>
    <style>
      html { color-scheme: dark; background: #071018; color: #d8e1e8; font: 16px system-ui, sans-serif; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
    </style>
    <script>
      (function () {
        var station = location.pathname.match(/^\/app\/station\/([^/]+)(?:\/index\.html|\/)?$/)
        var match = location.pathname.match(/^\/app\/(state|feed|map|similarity|network|patrol|review|justice|cyber|overview)\/?$/)
        var target = station
          ? '/app/station/index.html?code=' + encodeURIComponent(station[1])
          : match
            ? '/app/' + match[1] + '/index.html'
            : '/app/index.html'
        var query = location.search
          ? (target.indexOf('?') >= 0 ? '&' + location.search.slice(1) : location.search)
          : ''
        location.replace(target + query + location.hash)
      })()
    </script>
  </head>
  <body>Opening KSPCID…</body>
</html>
